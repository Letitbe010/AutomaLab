<!doctype html>
<html lang="eu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AutomaLab</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // If the app has not rendered after a few seconds (a module failed to
      // load), show a hint instead of a blank page. Static text: React may not run.
      setTimeout(function () {
        var root = document.getElementById('root');
        if (root && !root.hasChildNodes()) {
          root.innerHTML =
            '<div style="font-family:system-ui,sans-serif;max-width:520px;margin:15vh auto;padding:24px;border:1px solid #d3dce8;border-radius:16px;background:#fff">' +
            '<h1 style="font-size:18px;margin:0 0 8px">AutomaLab ez da kargatu</h1>' +
            '<p style="color:#51637a;font-size:14px">Nabigatzaileak bertsio zahar bat gorde du ziurrenik. Sakatu <b>Ctrl+Shift+R</b> orria berriro kargatzeko. Ez bada konpontzen, ziurtatu <code>npm run dev</code> martxan dagoela.</p>' +
            '<button onclick="location.reload()" style="padding:10px 16px;border:0;border-radius:10px;background:#0c95b0;color:#fff;font-weight:700;cursor:pointer">Freskatu orria</button>' +
            '</div>';
        }
      }, 5000);
    </script>
  </body>
</html>
